<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>골프 내기 정산</title>
  <meta name="theme-color" content="#0f3b28">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" aria-label="처음으로" hidden>‹</button>
    <h1 id="title">골프 내기 정산</h1>
    <span id="mode" class="mode"></span>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="score">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      스코어
    </button>
    <button data-tab="distance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4l11 4-11 4"/><ellipse cx="12" cy="20" rx="8" ry="2"/></svg>
      거리
    </button>
    <button data-tab="money">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
      정산
    </button>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
