<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>골프장 관리</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 4l11 4-11 4z" fill="#d9a521"/></svg>
      <b>골프장 관리</b><span>PC용</span>
    </div>
    <div class="progress" aria-live="polite">
      <span id="club-title">새 골프장</span>
      <div class="meter"><i id="meter"></i></div>
      <span id="prog-txt">그린 등록 0/0홀</span>
    </div>
    <div class="bar-actions">
      <label class="btn ghost file">불러오기<input type="file" id="import" accept=".json"></label>
      <button id="export" class="btn primary">JSON 파일로 저장</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <section class="step">
        <h2><i>1</i>지도에서 골프장 찾기</h2>
        <div class="row"><input id="q" placeholder="예) ○○컨트리클럽"><button id="search" class="btn">검색</button></div>
        <div id="results"></div>
        <label>지도 종류</label>
        <select id="layer">
          <option value="osm">일반 지도 (OpenStreetMap)</option>
          <option value="vworld">위성 사진 (브이월드, 키 필요)</option>
        </select>
        <div class="row" id="vw-row" hidden><input id="vwkey" placeholder="브이월드 API 키"><button id="vwsave" class="btn">적용</button></div>
      </section>

      <section class="step">
        <h2><i>2</i>골프장 기본 정보</h2>
        <label for="name">이름</label><input id="name">
        <label for="addr">주소</label><input id="addr">
        <label for="src">정보 출처 메모</label><input id="src" placeholder="예) 직접 현장 확인, OpenStreetMap">
      </section>

      <section class="step">
        <h2><i>3</i>코스와 홀</h2>
        <div class="tabs-row" id="course-tabs"></div>
        <div class="row tools">
          <button id="add-course" class="btn ghost">+ 코스 추가</button>
          <button id="rename-course" class="btn ghost">이름 바꾸기</button>
          <button id="del-course" class="btn ghost danger">삭제</button>
        </div>
        <button id="osm" class="btn wide">OpenStreetMap에서 홀·그린 자동 불러오기</button>
        <p class="hint">표의 [앞]·[중앙]·[뒤]를 누른 뒤 지도를 클릭하면 저장돼요. 마커는 끌어서 옮길 수 있어요.</p>
        <table id="holes"></table>
      </section>

      <section class="step">
        <h2><i>4</i>저장</h2>
        <p class="hint">위쪽 <b>JSON 파일로 저장</b>을 누르고, 그 파일을 휴대폰 앱 처음 화면의 <b>골프장 파일</b>로 불러오거나
          <code>golf-app/app/courses/</code> 폴더에 넣고 <code>index.json</code> 목록에 추가하세요.</p>
        <button id="reset" class="btn ghost danger wide">새로 시작 (지금 작업 지우기)</button>
      </section>
    </aside>

    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend">
        <span><i class="pin front"></i>그린 앞</span>
        <span><i class="pin center"></i>중앙</span>
        <span><i class="pin back"></i>뒤</span>
      </div>
      <div id="status" class="status" hidden></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
