<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보병 전선</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1712">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0f1712;--card:#16231a;--line:#2a3c2f;--text:#e8efe9;--sub:#9fb3a5;--gold:#e0b24e;--go:#3f9a5a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#1d3324,var(--bg) 70%);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px}
  .box{width:min(460px,100%);text-align:center}
  img{width:132px;height:132px;border-radius:28px;box-shadow:0 10px 40px #0008}
  h1{font-size:34px;margin:18px 0 6px;color:var(--gold);letter-spacing:.02em}
  p{color:var(--sub);margin:0 0 26px;line-height:1.6}
  button{display:block;width:100%;padding:16px;margin:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;font-weight:600;cursor:pointer}
  button.main{background:var(--go);border-color:#56b372;font-size:19px}
  button:hover{filter:brightness(1.12)}
  #bInstall{display:none}
  small{display:block;color:var(--sub);margin-top:18px;line-height:1.6}
  #msg{color:var(--gold);min-height:1.4em;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <img src="icon-512.png" alt="">
  <h1>보병 전선</h1>
  <p>병사가 저절로 나와 싸우는 4인 3D 전장</p>
  <button class="main" id="bWin">새 창으로 게임 시작</button>
  <button id="bDogam">도감 보기 (새 창)</button>
  <button id="bInstall">앱으로 설치 (바탕화면 아이콘)</button>
  <button id="bHere">이 창에서 시작</button>
  <div id="msg"></div>
  <small>‘앱으로 설치’를 하면 다음부터 바탕화면 아이콘으로 주소창 없는 전용 창에서 바로 실행됩니다.<br>(크롬·엣지에서 지원)</small>
</div>
<script>
const GAME='game.html';
// 이미 설치된 앱으로 열렸다면 바로 게임으로
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)location.replace(GAME);
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
$('bWin').onclick=()=>{
  const w=Math.min(1600,screen.availWidth-40),h=Math.min(1000,screen.availHeight-60);
  const x=Math.max(0,(screen.availWidth-w)/2),y=Math.max(0,(screen.availHeight-h)/2);
  const win=window.open(GAME,'footline_game',`popup=yes,width=${w},height=${h},left=${x},top=${y}`);
  if(!win){msg('팝업이 막혀 있어요. 주소창 오른쪽의 팝업 차단 표시를 눌러 허용해 주세요.');return}
  win.focus();msg('새 창에서 게임이 열렸어요.');
};
$('bHere').onclick=()=>location.href=GAME;
$('bDogam').onclick=()=>{const w=Math.min(1280,screen.availWidth-40),h=Math.min(900,screen.availHeight-60);
  const win=window.open('dogam.html','footline_dogam',`popup=yes,width=${w},height=${h},left=${Math.max(0,(screen.availWidth-w)/2)},top=${Math.max(0,(screen.availHeight-h)/2)}`);
  if(!win){msg('팝업이 막혀 있어요. 주소창 오른쪽의 팝업 차단 표시를 눌러 허용해 주세요.');return}win.focus()};
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('bInstall').style.display='block'});
$('bInstall').onclick=async()=>{if(!deferred)return;deferred.prompt();const r=await deferred.userChoice;deferred=null;$('bInstall').style.display='none';
  msg(r.outcome==='accepted'?'설치됐어요! 바탕화면이나 시작 메뉴의 ‘보병 전선’ 아이콘으로 실행하세요.':'설치를 취소했어요.')};
addEventListener('appinstalled',()=>msg('설치됐어요! 바탕화면이나 시작 메뉴의 ‘보병 전선’ 아이콘으로 실행하세요.'));
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
